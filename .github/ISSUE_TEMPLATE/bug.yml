name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: App status
      description: >
        Settings → The app → **App status** → Copy, then paste it here. It
        names the phone, the Android version, the screen, and whether the
        phone is allowing chimes at all. It holds nothing about you and
        nothing you have logged.
      placeholder: |
        Phone: Xiaomi 2312CRNCCL · Android 16 (API 36) · MIUI/HyperOS V816 · armeabi-v7a
        Screen: 360 × 825 dp @2
        Background: active
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Chimes not firing
        - Today screen
        - Daily Sets or the program
        - Goals or tests
        - Practice or drilling
        - Weather or location
        - Character sheet
        - Setup or settings
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: chimes
    attributes:
      label: If chimes are the problem
      description: >
        Settings → The day → **Stay alive** lists what this phone needs.
        Which rows are not done? And two things that stop chimes without
        looking like a bug: did you clear the app from recent apps, or
        press Stop on it in the notification shade? Either one takes the
        scheduled chimes with it until the app is opened again.
  - type: textarea
    id: export
    attributes:
      label: Your data export, if it helps
      description: >
        Settings → Data → Export copies everything the app has recorded.
        Attach it only if you are comfortable — it is your training log.
