# Tag a version, get an APK attached to a GitHub release.
#
# The APK this builds is UNSIGNED by release standards — the signing key
# never leaves the maintainer's machine, so CI cannot produce something
# installable over a real install. It is here so a tag always has a
# reproducible artifact people can inspect, not as the distribution path.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: RaveLiteApp/yarn.lock

      - run: yarn install --frozen-lockfile
        working-directory: RaveLiteApp

      - run: ./gradlew assembleRelease --no-daemon
        working-directory: RaveLiteApp/android

      - uses: softprops/action-gh-release@v2
        with:
          files: RaveLiteApp/android/app/build/outputs/apk/release/app-*-release.apk
          body: |
            Built from ${{ github.ref_name }}.

            One APK per architecture, plus a universal one that runs on
            all of them. These are debug-signed by CI and cannot update a
            properly signed install. They are here to be inspected and
            built upon, not to be the way you get the app.
