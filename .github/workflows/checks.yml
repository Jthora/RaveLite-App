# Every pull request gets the same three checks the maintainer runs, so a
# contributor finds out from CI rather than from a review comment.
#
# No Android build here on purpose: it needs the SDK, takes minutes, and
# these three catch what review cannot see at a glance.
#
# **This may not run at all.** GitHub Actions on this account is billing
# locked, so jobs are refused before they start. The workflow is kept
# because it costs nothing to keep and starts working by itself the day
# that changes — but do not wait on it, and do not read a red mark here
# as a verdict on your patch. Run the three commands in CONTRIBUTING.md
# yourself; that is what the maintainer does.
#
# It no longer runs on push, only on pull requests: a refused job on
# every push painted a failure on the repo's front page for work that
# never happened.
name: checks

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RaveLiteApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: RaveLiteApp/yarn.lock

      - run: yarn install --frozen-lockfile

      # Types first: the cheapest check, and the one that caught a bug
      # rendering blank labels for months.
      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npx eslint .

      - name: test
        run: npx jest --ci

      # Again on the other side of the world. Local days are the app's
      # spine, and a test that quietly depends on the machine's clock
      # passes at home and fails for somebody else.
      - name: test (another timezone)
        run: npx jest --ci
        env:
          TZ: Australia/Lord_Howe
